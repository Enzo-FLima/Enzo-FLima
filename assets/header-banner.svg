<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="100%">
  <defs>
    <linearGradient id="hBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0d1326" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }
      .glow-line { animation: pulseGlow 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="2" y="2" width="996" height="216" rx="14" fill="url(#hBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle perspective grid lines -->
  <g stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.55">
    <line x1="0" y1="44" x2="1000" y2="44" />
    <line x1="0" y1="88" x2="1000" y2="88" />
    <line x1="0" y1="132" x2="1000" y2="132" />
    <line x1="0" y1="176" x2="1000" y2="176" />
    <line x1="120" y1="0" x2="120" y2="220" />
    <line x1="280" y1="0" x2="280" y2="220" />
    <line x1="500" y1="0" x2="500" y2="220" />
    <line x1="720" y1="0" x2="720" y2="220" />
    <line x1="880" y1="0" x2="880" y2="220" />
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 18 42 L 18 18 L 48 18" fill="none" stroke="#00f0ff" stroke-width="2.5" />
  <path d="M 952 18 L 982 18 L 982 42" fill="none" stroke="#a855f7" stroke-width="2.5" />
  <path d="M 18 178 L 18 202 L 48 202" fill="none" stroke="#10b981" stroke-width="2.5" />
  <path d="M 952 202 L 982 202 L 982 178" fill="none" stroke="#00f0ff" stroke-width="2.5" />

  <!-- Top Telemetry Pill -->
  <rect x="355" y="24" width="290" height="24" rx="12" fill="#0f172a" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1" />
  <circle cx="373" cy="36" r="4" fill="#10b981" />
  <text x="508" y="40" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5" class="mono">
    SYSTEM.INIT("ENZO_LIMA") // v2.6
  </text>

  <!-- Main Name Title -->
  <text x="500" y="106" text-anchor="middle" fill="url(#titleGrad)" font-size="48" font-weight="900" letter-spacing="4" class="sans">
    ENZO FERREIRA DE LIMA
  </text>

  <!-- Role Subtitle -->
  <text x="500" y="140" text-anchor="middle" fill="#e2e8f0" font-size="15.5" font-weight="600" letter-spacing="2.5" class="mono">
    ENGENHARIA DE SOFTWARE  •  DESENVOLVIMENTO DE SOFTWARE &amp; SISTEMAS
  </text>

  <!-- Animated Neon Divider -->
  <rect x="180" y="156" width="640" height="2.5" rx="1.25" fill="url(#lineGrad)" class="glow-line" />

  <!-- Impact Tagline -->
  <text x="500" y="186" text-anchor="middle" fill="#94a3b8" font-size="13.5" class="mono">
    &lt; Convertendo lógica, arquitetura e curiosidade técnica em soluções de software eficientes /&gt;
  </text>
</svg>